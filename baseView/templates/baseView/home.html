<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Form</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-md-5 col-lg-4">

                <div class="card border-0 shadow-lg rounded-4">

                    <div class="card-body p-4">

                        <h2 class="text-center fw-bold mb-2">
                            User Form
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Enter your details below
                        </p>

                        <form method="POST" action="" >

                            {% csrf_token %}

                            <!-- Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">
                                    Name
                                </label>

                                <input type="text" class="form-control form-control-lg rounded-3" id="name" name="name"
                                    placeholder="Enter your name" required>
                            </div>

                            <!-- Age -->
                            <div class="mb-4">
                                <label for="age" class="form-label fw-semibold">
                                    Age
                                </label>

                                <input type="number" class="form-control form-control-lg rounded-3" id="age" name="age"
                                    placeholder="Enter your age" min="1" max="100" required>
                            </div>

                            <!-- Submit -->
                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3">
                                Submit
                            </button>

                        </form>

                    </div>
                </div>

            </div>

        </div>
    </div>

</body>

</html>
