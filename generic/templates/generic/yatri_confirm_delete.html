```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirm Delete</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at top, #3b0a0a, transparent 40%),
                linear-gradient(135deg, #050505, #160808);

            font-family: Arial, sans-serif;
            color: white;
        }

        .delete-card {
            width: 90%;
            max-width: 450px;

            padding: 45px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(220, 38, 38, 0.08);
        }

        .delete-icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(220, 38, 38, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);

            color: #ef4444;

            font-size: 38px;

            box-shadow: 0 0 30px rgba(239, 68, 68, 0.15);
        }

        h2 {
            margin-bottom: 12px;

            font-size: 28px;
            font-weight: 700;
        }

        .warning-text {
            color: #a1a1aa;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .warning-text strong {
            color: #f87171;
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;

            padding: 13px 20px;

            border-radius: 10px;

            font-weight: 600;
            text-decoration: none;

            transition: all 0.3s ease;
        }

        .btn-delete {
            border: none;

            background: linear-gradient(135deg, #dc2626, #991b1b);

            color: white;

            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.25);
        }

        .btn-delete:hover {
            transform: translateY(-2px);

            background: linear-gradient(135deg, #ef4444, #b91c1c);

            box-shadow: 0 12px 28px rgba(220, 38, 38, 0.4);
        }

        .btn-cancel {
            border: 1px solid rgba(255, 255, 255, 0.15);

            background: rgba(255, 255, 255, 0.06);

            color: #d4d4d8;
        }

        .btn-cancel:hover {
            transform: translateY(-2px);

            background: rgba(255, 255, 255, 0.12);

            color: white;
        }

        @media (max-width: 480px) {
            .delete-card {
                padding: 35px 22px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="delete-card">

        <div class="delete-icon">
            <i class="bi bi-trash3"></i>
        </div>

        <h2>Confirm Delete</h2>

        <p class="warning-text">
            Are you sure you want to delete this item?
            <br>
            <strong>This action cannot be undone.</strong>
        </p>

        <form method="post" action="">

            {% csrf_token %}

            <div class="button-group">

                <a href="javascript:history.back()" class="btn btn-cancel">
                    Cancel
                </a>

                <button type="submit" class="btn btn-delete">
                    <i class="bi bi-trash3 me-2"></i>
                    Yes, Delete
                </button>

            </div>

        </form>

    </div>

</body>

</html>
