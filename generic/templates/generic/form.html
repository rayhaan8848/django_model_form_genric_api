<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg, #0f172a, #1e293b);
            font-family: Arial, sans-serif;
        }

        .form-card {
            width: 100%;
            max-width: 450px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .form-title {
            color: #fff;
            text-align: center;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            color: #e2e8f0;
            font-weight: 600;
            margin-bottom: 8px;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 12px 15px;

            background: rgba(255, 255, 255, 0.08);
            color: white;

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;

            outline: none;
            transition: 0.3s;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        form input::placeholder,
        form textarea::placeholder {
            color: #94a3b8;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;

            font-size: 16px;
            font-weight: 600;

            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
        }
    </style>
</head>

<body>

    <div class="form-card">

        <h2 class="form-title">Create Record</h2>

        <p class="form-subtitle">
            Fill in the details below
        </p>

        <form method="post" action="">

            {% csrf_token %}

            {{ form }}

            <button type="submit" class="submit-btn">
                Submit
            </button>

        </form>

    </div>

</body>

</html>
